<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zoo | ooZ — EXPLORE</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Courier New', monospace;
        }
        main {
            position: relative;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
        }
        .ratio {
            position: absolute;
            z-index: 8;
            display: grid;
            grid-template-columns: repeat(4, clamp(18px, 1.78vw, 36px));
            cursor: grab;
            touch-action: none;
            user-select: none;
        }
        .ratio[data-corner="top-left"] { top: 4.6vh; left: 2.15vw; }
        .ratio[data-corner="top-right"] { top: 4.6vh; right: 2.15vw; }
        .ratio[data-corner="bottom-left"] { bottom: 4.6vh; left: 2.15vw; }
        .ratio[data-corner="bottom-right"] { bottom: 4.6vh; right: 2.15vw; }
        .ratio.is-dragging {
            cursor: grabbing;
            bottom: auto;
        }
        .dot {
            width: clamp(18px, 1.78vw, 36px);
            height: clamp(18px, 1.78vw, 36px);
            border: 2px solid #ff00db;
            background: #ff002b;
            border-radius: 50%;
            pointer-events: none;
        }
        .dot.animal {
            background: #00ffe4;
            border-color: #00ff41;
        }
        .corner-navigation {
            position: absolute;
            inset: 0;
            z-index: 7;
            visibility: hidden;
            pointer-events: none;
        }
        main.is-navigating .corner-navigation {
            visibility: visible;
        }
        .corner-link {
            position: absolute;
            display: grid;
            place-items: center;
            width: clamp(90px, 23%, 180px);
            height: clamp(90px, 20%, 150px);
            padding: 12px;
            border: 1px dashed #feffd8;
            background: rgb(44 44 44 / 80%);
            color: #feffd8;
            font-size: clamp(11px, 1vw, 15px);
            text-align: center;
            text-decoration: none;
            transition: background-color 0.15s ease;
        }
        .corner-link[data-corner="top-left"] { top: 0; left: 0; }
        .corner-link[data-corner="top-right"] { top: 0; right: 0; }
        .corner-link[data-corner="bottom-left"] { bottom: 0; left: 0; }
        .corner-link[data-corner="bottom-right"] { bottom: 0; right: 0; }
        .corner-link.is-target {
            border-style: solid;
            background: #2b80ff;
            color: #ffffff;
        }
        @media (max-width: 600px) {
            .ratio {
                grid-template-columns: repeat(4, 4.5vw);
            }
            .dot {
                width: 4.5vw;
                height: 4.5vw;
            }
        }
        body { background: #aaaaaa; }
    </style>
</head>
<body>
    <main>
        <!-- 이 영역에 해당 페이지의 디자인을 추가하세요. -->
        <div class="ratio" data-corner="bottom-left" title="모서리로 드래그하여 페이지 이동"></div>
        <nav class="corner-navigation">
            <a class="corner-link" data-corner="top-left" href="index2.html">MAIN ↖</a>
            <a class="corner-link" data-corner="top-right" href="index.html">MIX ↗</a>
            <a class="corner-link" data-corner="bottom-left" href="index3.html">EXPLORE ↙</a>
            <a class="corner-link" data-corner="bottom-right" href="about.html">ABOUT ↘</a>
        </nav>
    </main>
    <script>
        function setupCornerNavigation() {
            const main = document.querySelector('main');
            const ratio = document.querySelector('.ratio');
            const links = Array.from(document.querySelectorAll('.corner-link'));
            let drag = null;

            function findCorner(x, y) {
                const bounds = main.getBoundingClientRect();
                const width = Math.min(180, Math.max(90, bounds.width * 0.23));
                const height = Math.min(150, Math.max(90, bounds.height * 0.2));
                const left = x >= bounds.left && x <= bounds.left + width;
                const right = x <= bounds.right && x >= bounds.right - width;
                const top = y >= bounds.top && y <= bounds.top + height;
                const bottom = y <= bounds.bottom && y >= bounds.bottom - height;

                if (left && top) return 'top-left';
                if (right && top) return 'top-right';
                if (left && bottom) return 'bottom-left';
                if (right && bottom) return 'bottom-right';
                return null;
            }

            function highlight(corner) {
                links.forEach((link) => {
                    link.classList.toggle('is-target', link.dataset.corner === corner);
                });
            }

            function restore() {
                ratio.style.removeProperty('left');
                ratio.style.removeProperty('top');
                ratio.style.removeProperty('right');
                main.classList.remove('is-navigating');
                ratio.classList.remove('is-dragging');
                highlight(null);
            }

            ratio.addEventListener('pointerdown', (event) => {
                if (!event.isPrimary || event.button !== 0) return;
                event.preventDefault();
                event.stopPropagation();

                const bounds = ratio.getBoundingClientRect();
                drag = {
                    pointerId: event.pointerId,
                    startX: event.clientX,
                    startY: event.clientY,
                    offsetX: event.clientX - bounds.left,
                    offsetY: event.clientY - bounds.top,
                    moved: false
                };

                ratio.setPointerCapture(event.pointerId);
            });

            ratio.addEventListener('pointermove', (event) => {
                if (!drag || drag.pointerId !== event.pointerId) return;
                event.preventDefault();

                if (!drag.moved) {
                    const distance = Math.hypot(
                        event.clientX - drag.startX,
                        event.clientY - drag.startY
                    );
                    if (distance < 7) return;
                    drag.moved = true;
                    main.classList.add('is-navigating');
                    const origin = ratio.getBoundingClientRect();
                    const parent = main.getBoundingClientRect();
                    ratio.style.left = `${origin.left - parent.left}px`;
                    ratio.style.top = `${origin.top - parent.top}px`;
                    ratio.style.right = 'auto';
                    ratio.classList.add('is-dragging');
                }

                const bounds = main.getBoundingClientRect();
                const graphic = ratio.getBoundingClientRect();
                const x = Math.max(0, Math.min(
                    bounds.width - graphic.width,
                    event.clientX - bounds.left - drag.offsetX
                ));
                const y = Math.max(0, Math.min(
                    bounds.height - graphic.height,
                    event.clientY - bounds.top - drag.offsetY
                ));

                ratio.style.left = `${x}px`;
                ratio.style.top = `${y}px`;
                ratio.style.right = 'auto';
                highlight(findCorner(event.clientX, event.clientY));
            });

            function finish(event, cancelled = false) {
                if (!drag || drag.pointerId !== event.pointerId) return;
                const corner = !cancelled && drag.moved
                    ? findCorner(event.clientX, event.clientY)
                    : null;
                const target = links.find((link) => link.dataset.corner === corner);
                const pointerId = drag.pointerId;
                drag = null;

                if (ratio.hasPointerCapture(pointerId)) {
                    ratio.releasePointerCapture(pointerId);
                }

                restore();
                if (target) window.location.assign(target.href);
            }

            ratio.addEventListener('pointerup', (event) => finish(event));
            ratio.addEventListener('pointercancel', (event) => finish(event, true));
            ratio.addEventListener('lostpointercapture', (event) => finish(event, true));
            ratio.addEventListener('click', (event) => {
                event.preventDefault();
                event.stopPropagation();
            });
            ratio.addEventListener('dragstart', (event) => event.preventDefault());

            window.addEventListener('resize', () => {
                if (drag) finish({ pointerId: drag.pointerId }, true);
            });
            window.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && drag) {
                    finish({ pointerId: drag.pointerId }, true);
                }
            });
        }

        const ratio = document.querySelector('.ratio');

        // 비율 그래픽의 예시 수치입니다. 각 숫자를 변경할 수 있습니다.
        const counts = { human: 8, animal: 8 };
        const total = counts.human + counts.animal;
        const humanDots = total ? Math.round(counts.human / total * 16) : 0;

        for (let i = 0; i < 16; i++) {
            const dot = document.createElement('span');
            dot.className = i < humanDots ? 'dot' : 'dot animal';
            ratio.append(dot);
        }

        setupCornerNavigation();
    </script>
</body>
</html>
